<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>프로세스 한글 강조 시안</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;padding:48px 4vw 80px}
h1{font-size:20px;margin:0 0 6px}
.sub{color:rgba(255,255,255,.5);font-size:14px;margin:0 0 48px}
.v{margin-bottom:72px;padding:36px 28px 40px;border-radius:20px;background:radial-gradient(60% 80% at 70% 60%,rgba(48,97,255,.22),transparent 70%),#05070d;border:1px solid rgba(255,255,255,.08)}
.lab{font-size:13px;font-weight:700;letter-spacing:.14em;color:#6b8cff;margin:0 0 4px}
.desc{font-size:14px;color:rgba(255,255,255,.55);margin:0 0 36px}
ul{display:flex;gap:0;margin:0;padding:0;list-style:none;overflow-x:auto}
li{position:relative;flex:1 0 220px;padding:46px 28px 0 0}
.dot{position:absolute;left:0;top:0;width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.3);transform:scale(.47)}
.line{position:absolute;left:15px;top:7px;right:0;height:1px;background:rgba(255,255,255,.22)}
li.on .dot{background:radial-gradient(circle,#9db8ff,#4a78ff 55%,#3061ff);transform:none;box-shadow:0 0 10px 2px rgba(48,97,255,.55),0 0 22px 6px rgba(48,97,255,.28)}
li.on .line{background:#fff}
li.cur .dot{background:radial-gradient(circle,#fff,#a9c0ff 35%,#4a78ff 80%);transform:scale(1.3);box-shadow:0 0 12px 3px rgba(90,135,255,.85),0 0 30px 10px rgba(48,97,255,.5)}
li.cur .line{background:rgba(255,255,255,.22)}
.tag{font-size:13px;font-weight:700;letter-spacing:.16em;color:rgba(107,140,255,.45);margin:0 0 14px}
li.on .tag{color:#6b8cff}
.body{font-size:14px;line-height:1.6;color:rgba(255,255,255,.25);margin:12px 0 0;word-break:keep-all}
li.on .body{color:rgba(255,255,255,.5)}li.cur .body{color:rgba(255,255,255,.88)}

/* A — 알약 배지 (FACT 버튼 스타일) */
.A .ko{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 24px 0 18px;border-radius:999px;font-size:24px;font-weight:800;letter-spacing:-.03em;color:rgba(255,255,255,.3);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.A .ko svg{width:20px;height:20px;opacity:.4}
.A li.on .ko{color:#fff;background:#3061ff;border-color:transparent;box-shadow:0 0 18px rgba(48,97,255,.55)}
.A li.on .ko svg{opacity:1}
.A li.cur .ko{box-shadow:0 0 0 4px rgba(48,97,255,.25),0 0 32px rgba(48,97,255,.8)}
.A .en{margin:10px 0 0 6px;font-size:12px;font-weight:700;letter-spacing:.2em;color:rgba(255,255,255,.3)}
li.on .en{color:#6b8cff}

/* B — 초대형 한글 + 작은 영문, 형광펜 밑줄 */
.B .en{margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.2em;color:rgba(255,255,255,.3)}
li.on .en{color:#6b8cff}
.B .ko{display:inline-block;position:relative;font-size:clamp(44px,4.6vw,72px);font-weight:900;line-height:1.1;letter-spacing:-.06em;color:rgba(255,255,255,.2)}
.B li.on .ko{color:rgba(255,255,255,.7)}
.B li.cur .ko{color:#fff}
.B .ko::after{content:"";position:absolute;left:-2px;right:-2px;bottom:.08em;height:.28em;background:#3061ff;opacity:0;z-index:-1;border-radius:3px;transform-origin:left;transform:scaleX(0)}
.B li.cur .ko::after{opacity:.85;transform:none}
.B li.on:not(.cur) .ko::after{opacity:.35;transform:none}

/* C — 파란 그라데이션 글자 + 글로우, 큰 번호 아웃라인 */
.C li{padding-top:34px}
.C .num{position:absolute;right:20px;top:34px;font-size:84px;font-weight:900;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.1)}
li.on.C .num,.C li.on .num{-webkit-text-stroke-color:rgba(107,140,255,.35)}
.C .ko{margin:0;font-size:clamp(40px,4vw,64px);font-weight:900;line-height:1.1;letter-spacing:-.06em;color:rgba(255,255,255,.2)}
.C li.on .ko{background:linear-gradient(180deg,#fff 10%,#7fa0ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.C li.cur .ko{filter:drop-shadow(0 0 14px rgba(70,120,255,.8)) drop-shadow(0 0 36px rgba(48,97,255,.5))}
.C .en{margin:8px 0 0;font-size:13px;font-weight:700;letter-spacing:.22em;color:rgba(255,255,255,.25)}
li.on .en{color:rgba(255,255,255,.6)}
</style></head><body>
<h1>프로세스 — 한글(문의·진단·설계) 강조 시안 3가지</h1>
<p class="sub">지금은 "INQUIRY" 영문이 크고 한글은 본문 속 작은 글씨입니다. 아래는 모두 3번째(설계)가 현재 단계인 상태입니다.</p>
<script>
const S=[["STEP 1","INQUIRY","문의","병원의 현재 고민을 접수합니다."],["STEP 2","DIAGNOSIS","진단","마케팅 현황·주력 시술·경쟁병원까지 진단합니다."],["STEP 3","DESIGN","설계","진단 결과 위에 병원에 꼭 맞는 전략을 설계합니다."],["STEP 4","EXECUTION","실행","설계한 전략을 직접 실행하며 성과를 만듭니다."],["STEP 5","MANAGEMENT","관리","월간 리포트와 월 미팅으로 더 나은 방향으로 개선합니다."]];
const chk='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
const V=[
["A","시안 A — 알약 배지","첨부하신 FACT 버튼처럼, 한글을 파란 알약 안에 넣어 점등. 영문은 아래 작은 라벨.",(s)=>`<p class="tag">${s[0]}</p><span class="ko">${chk}${s[2]}</span><p class="en">${s[1]}</p><p class="body">${s[3]}</p>`],
["B","시안 B — 초대형 한글 + 형광펜 밑줄","한글을 가장 크게, 영문은 위에 작게. 현재 단계에는 파란 형광펜 띠.",(s)=>`<p class="tag">${s[0]}</p><p class="en">${s[1]}</p><span class="ko">${s[2]}</span><p class="body">${s[3]}</p>`],
["C","시안 C — 파란 그라데이션 글자 + 글로우","한글이 흰색→파랑 그라데이션으로 빛나고, 뒤에 큰 외곽선 번호.",(s,i)=>`<span class="num">0${i+1}</span><p class="tag">${s[0]}</p><p class="ko">${s[2]}</p><p class="en">${s[1]}</p><p class="body">${s[3]}</p>`]];
for(const [k,t,d,f] of V){
 document.body.insertAdjacentHTML("beforeend",`<section class="v ${k}"><p class="lab">${t}</p><p class="desc">${d}</p><ul>${S.map((s,i)=>`<li class="${i<=2?"on":""} ${i==2?"cur":""}"><span class="dot"></span>${i<4?'<span class="line"></span>':""}${f(s,i)}</li>`).join("")}</ul></section>`);
}
</script>
</body></html>
